services:
  web:
    image: smohanty010620/divinity-harmony:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7800:80"
    environment:
      DH_DB_PATH: /data/divinity-harmony.db
    volumes:
      - divinity-data:/data
    restart: unless-stopped

volumes:
  divinity-data:
