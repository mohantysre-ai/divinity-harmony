services:
  web:
    image: smohanty010620/divinity-harmony:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
        VITE_LIVE_DARSHAN_FEED_URL: ${VITE_LIVE_DARSHAN_FEED_URL:-}
        VITE_SUPPORT_URL: ${VITE_SUPPORT_URL:-}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://mantra.sigq.in}
    ports:
      - "7800:80"
    environment:
      DH_DB_PATH: /data/divinity-harmony.db
    volumes:
      - divinity-data:/data
    restart: unless-stopped

volumes:
  divinity-data:
