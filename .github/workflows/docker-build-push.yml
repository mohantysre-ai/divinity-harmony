name: Build and push Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: smohanty010620/divinity-harmony

jobs:
  build-push-test:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: divinity-harmony-smoke:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image locally in CI
        run: |
          set -euo pipefail
          docker run -d --name divinity-smoke -p 7800:80 divinity-harmony-smoke:latest
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:7800/" -o /tmp/home.html; then
              break
            fi
            sleep 2
          done
          grep -E 'index-[A-Za-z0-9_-]+\.js' /tmp/home.html
          JS=$(grep -oE 'index-[A-Za-z0-9_-]+\.js' /tmp/home.html | head -n1)
          curl -fsS "http://127.0.0.1:7800/assets/${JS}" -o /tmp/app.js
          grep -q "Asato Ma Sad Gamaya" /tmp/app.js
          grep -q "Surya Namaskar Mantra 1" /tmp/app.js
          grep -q "Tap Play to hear this mantra" /tmp/app.js
          grep -q "commons/6/64/Ganesha" /tmp/app.js
          echo "CI smoke test passed"
          docker rm -f divinity-smoke

      - name: Push image to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
